spring.application.name=logilink-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/logilink?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

logilink.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-256-bits-before-production}
logilink.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
logilink.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
logilink.seed.enabled=${SEED_ENABLED:true}

springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui

# Mail & SMTP configuration (configured via environment variables)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

logilink.mail.enabled=${LOGILINK_MAIL_ENABLED:false}
logilink.mail.from=${LOGILINK_MAIL_FROM:noreply@logilink.edu}
logilink.frontend.url=${FRONTEND_URL:http://localhost:5173}
logilink.reset-token.expiration-minutes=${RESET_TOKEN_EXPIRATION_MINUTES:15}
logilink.dev-mode=${LOGILINK_DEV_MODE:true}
