
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitSphere - Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-wrapper">

        <div class="login-brand">
            <div class="brand-circle">🏋️</div>
            <h1>FitSphere</h1>
            <h2>Start Your Fitness Journey!</h2>
            <p>
                Create your account to track workouts,
                monitor progress and achieve your fitness goals.
            </p>
        </div>

        <div class="login-box">
            <h2>Create Account</h2>
            <p class="login-subtitle">Join FitSphere today!</p>

            <form id="registerForm">

                <label for="regUsername">Username</label>
                <input
                    type="text"
                    id="regUsername"
                    placeholder="Choose a username"
                    minlength="3"
                    maxlength="30"
                    autocomplete="username"
                    required
                >

                <label for="regEmail">Email</label>
                <input
                    type="email"
                    id="regEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="regPassword">Password</label>
                <input
                    type="password"
                    id="regPassword"
                    placeholder="Create a password (8+ characters)"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button type="submit" id="registerButton">
                    Create Account
                </button>

                <p id="registerMessage" role="status"></p>

                <p class="login-subtitle">
                    Already have an account?
                    <a href="login.html">Login here</a>
                </p>

            </form>
        </div>

    </div>

    <script>
        const registerForm = document.getElementById("registerForm");
        const registerMessage = document.getElementById("registerMessage");
        const registerButton = document.getElementById("registerButton");

        registerForm.addEventListener("submit", async function(event) {
            event.preventDefault();
             console.log("Register form submitted!");
            const username =
                document.getElementById("regUsername").value.trim();
            const email =
                document.getElementById("regEmail").value.trim();
            const password =
                document.getElementById("regPassword").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                registerMessage.textContent = "Passwords do not match.";
                return;
            }

            if (password.length < 8) {
                registerMessage.textContent =
                    "Password must contain at least 8 characters.";
                return;
            }

            registerButton.disabled = true;
            registerButton.textContent = "Creating account...";
            registerMessage.textContent = "";

            try {
                const response = await fetch(
                    "http://localhost:3000/api/register",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            username: username,
                            email: email,
                            password: password
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message || "Registration failed."
                    );
                }

                registerMessage.textContent =
                    "Account created successfully! Redirecting to login...";

                registerForm.reset();
window.location.href = "http://127.0.0.1:5500/login.html";

            } catch (error) {
                console.error("Registration error:", error);
                registerMessage.textContent =
                    error.message === "Failed to fetch"
                    ? "Cannot connect to the backend. Please check the server."
                    : error.message;
            } finally {
                registerButton.disabled = false;
                registerButton.textContent = "Create Account";
            }
        });
    </script>

</body>
</html>
